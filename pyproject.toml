[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droidfleet"
version = "0.3.2"
description = "Cross-platform device fleet orchestration platform with Android ADB and Windows FarmAgent support"
readme = "README.md"
license = "MIT"
authors = [{ name = "DroidFleet contributors" }]
keywords = ["android", "adb", "fleet", "orchestration", "farmagent", "remote-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
]
requires-python = ">=3.13"
dependencies = ["Pillow>=10.0", "psutil>=5.9", "PyAutoGUI>=0.9.54"]

[project.scripts]
droidfleet = "app.cli:main"
farm-agent = "agent.agent:main"

[tool.setuptools.packages.find]
include = ["app*", "agent*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
